# ── NAKPIX MCP — deployment (background services) ─────────────────────
# The MCP server itself is launched by the agent client (stdio). These two
# long-running services are what keep scheduled payments and the 15-minute
# incident monitor alive even when no agent conversation is open.
#
# The bind mount `~/.nakpix:/nakpix` shares the agent's LOCAL storage
# (encrypted wallets + schedule/payment DB), so the Docker services act on the
# SAME wallets and schedules as the agent — not a separate volume.
#
# Permissions: the container runs as an unprivileged user. Make sure ~/.nakpix
# is owned by the uid/gid below (default 1000:1000; override with
# NAKPIX_UID/NAKPIX_GID to match your host user).
#
#   docker compose up -d
#
services:
  scheduler:
    build:
      context: .
      args:
        NAKPIX_UID: ${NAKPIX_UID:-1000}
    image: nakpix-mcp:latest
    command: ["nakpix-scheduler"]
    restart: unless-stopped
    user: "${NAKPIX_UID:-1000}:${NAKPIX_GID:-1000}"
    env_file: .env
    environment:
      NAKPIX_HOME: /nakpix
    volumes:
      - ~/.nakpix:/nakpix

  incidents:
    build:
      context: .
      args:
        NAKPIX_UID: ${NAKPIX_UID:-1000}
    image: nakpix-mcp:latest
    command: ["nakpix-incidents"]
    restart: unless-stopped
    user: "${NAKPIX_UID:-1000}:${NAKPIX_GID:-1000}"
    env_file: .env
    environment:
      NAKPIX_HOME: /nakpix
      NAKPIX_INCIDENT_MINUTES: ${NAKPIX_INCIDENT_MINUTES:-15}
    volumes:
      - ~/.nakpix:/nakpix
